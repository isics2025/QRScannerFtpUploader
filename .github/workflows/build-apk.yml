name: Build Debug APK

# Триггеры: пуш и PR в main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Явно даём GITHUB_TOKEN необходимые права
permissions:
  contents: read       # читать код
  actions: write       # использовать/загружать действия
  packages: read       # (на всякий случай)
  id-token: write      # если понадобятся future–OIDC-токены

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
