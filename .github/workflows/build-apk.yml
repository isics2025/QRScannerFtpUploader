name: Build Debug APK

# Даем GITHUB_TOKEN право читать содержимое и записывать артефакты
permissions:
  contents: read
  artifacts: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Чекаутим репозиторий
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Устанавливаем JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'   # AdoptOpenJDK
          java-version: '17'

      # 3. Делаем gradlew исполняемым
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. Собираем debug-версию APK
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # 5. Загружаем собранный APK как артефакт
      - name: Upload Debug APK
        uses: actions/upload-artifact@v2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
